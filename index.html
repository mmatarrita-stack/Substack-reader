<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Substack Reader</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f1f5f9}button{cursor:pointer;font-family:inherit}input,select,textarea{font-family:inherit}</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const ANN_KEY="sr-v1-annotations";
const CATS_KEY="sr-v1-custom-cats";
const AREAS_KEY="sr-v1-areas";
const ANALYSES_KEY="sr-v1-analyses";
const NOTION_KEY="sr-v1-notion-key";
function getAnns(){try{return JSON.parse(localStorage.getItem(ANN_KEY)||"{}");}catch(e){return{};}}
function saveAnn(id,data){try{const a=getAnns();localStorage.setItem(ANN_KEY,JSON.stringify({...a,[id]:{...a[id],...data}}));}catch(e){}}
function getAnalyses(){try{return JSON.parse(localStorage.getItem(ANALYSES_KEY)||"{}");}catch(e){return{};}}
function saveAnalysisCache(id,text){try{const a=getAnalyses();a[id]=text;localStorage.setItem(ANALYSES_KEY,JSON.stringify(a));}catch(e){}}
const DEFAULT_CATS=["Agents","System","Branding","Learning","Business"];
const DEFAULT_AREAS=["Contabilidad","Cr\u00e9dito","Operaciones","Tecnolog\u00eda"];
function norm(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function titleSlug(t){return(t||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,70);}
function getCustomCats(){try{const s=JSON.parse(localStorage.getItem(CATS_KEY)||"null");if(!s||!s.length)return DEFAULT_CATS;const merged=[...DEFAULT_CATS];for(const c of s){if(!merged.includes(c))merged.push(c);}return merged;}catch(e){return DEFAULT_CATS;}}
function saveCustomCats(arr){try{localStorage.setItem(CATS_KEY,JSON.stringify(arr));}catch(e){}}
function getAreas(){try{const s=JSON.parse(localStorage.getItem(AREAS_KEY)||"null");if(!s||!s.length)return DEFAULT_AREAS;const merged=[...DEFAULT_AREAS];for(const a of s){if(!merged.includes(a))merged.push(a);}return merged;}catch(e){return DEFAULT_AREAS;}}
function saveAreas(arr){try{localStorage.setItem(AREAS_KEY,JSON.stringify(arr));}catch(e){}}
function useIsMobile(){const[m,setM]=useState(()=>window.innerWidth<680);useEffect(()=>{const h=()=>setM(window.innerWidth<680);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);return m;}
function parseAnalysis(text){const sections=[];const lines2=text.split("\n");let cur=null;for(const line of lines2){if(line.startsWith("## ")){if(cur)sections.push(cur);cur={title:line.slice(3).trim(),content:""};}else if(cur){cur.content+=(cur.content?"\n":"")+line;}}if(cur)sections.push(cur);return sections.map(s=>({...s,content:s.content.trim()}));}
const SEC_COL={"idea":{bg:"#eff6ff",border:"#bfdbfe",title:"#1d4ed8"},"problema":{bg:"#fff7ed",border:"#fed7aa",title:"#c2410c"},"aplica":{bg:"#f0fdf4",border:"#bbf7d0",title:"#15803d"},"framework":{bg:"#faf5ff",border:"#e9d5ff",title:"#7e22ce"},"herramienta":{bg:"#f0f9ff",border:"#bae6fd",title:"#0369a1"},"insight":{bg:"#fefce8",border:"#fef08a",title:"#a16207"},"accion":{bg:"#fff1f2",border:"#fecdd3",title:"#be123c"}};
function secColor(title){const t=title.toLowerCase();if(t.includes("idea"))return SEC_COL["idea"];if(t.includes("problema"))return SEC_COL["problema"];if(t.includes("aplica"))return SEC_COL["aplica"];if(t.includes("framework"))return SEC_COL["framework"];if(t.includes("herramienta"))return SEC_COL["herramienta"];if(t.includes("insight"))return SEC_COL["insight"];if(t.includes("accion"))return SEC_COL["accion"];return{bg:"#f8fafc",border:"#e2e8f0",title:"#334155"};}
const PROXY="https://api.rss2json.com/v1/api.json?rss_url=";
const SRCS=[{id:1,url:"https://oneusefulthing.substack.com/feed",name:"One Useful Thing"},{id:2,url:"https://opinionai.substack.com/feed",name:"Opinion AI"},{id:3,url:"https://jennyouyang.substack.com/feed",name:"Jenny Ouyang"},{id:4,url:"https://gencay.substack.com/feed",name:"Gencay I."},{id:5,url:"https://tudosisia.substack.com/feed",name:"Tu Dosisia"}];
const NOW=new Date(),CM=NOW.getMonth(),CY=NOW.getFullYear(),PM=CM===0?11:CM-1,PY=CM===0?CY-1:CY;
function txt(h){return(h||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();}
function fd(s){try{return new Date(s).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});}catch(e){return"---";}}
function ip(d,p){const dt=new Date(d);if(p==="cur")return dt.getMonth()===CM&&dt.getFullYear()===CY;if(p==="prev")return dt.getMonth()===PM&&dt.getFullYear()===PY;if(p==="60d")return(Date.now()-dt)/86400000<=60;return true;}
const RC={Alto:{bg:"#dcfce7",c:"#15803d"},Medio:{bg:"#fef9c3",c:"#a16207"},Bajo:{bg:"#f1f5f9",c:"#64748b"}};
const SC={Nuevo:{bg:"#dbeafe",c:"#1d4ed8"},Guardado:{bg:"#ede9fe",c:"#6d28d9"},Leido:{bg:"#f1f5f9",c:"#64748b"},Descartado:{bg:"#fee2e2",c:"#b91c1c"}};
const STATES=["Nuevo","Guardado","Leido","Descartado"];
const RELS=["Alto","Medio","Bajo"];
function PostCard({p,onSta,onNote,onCat,onRel,onArea,customCats,areas,onAddCat}){
  const[noteOpen,setNoteOpen]=useState(false);
  const[catOpen,setCatOpen]=useState(false);
  const[resumeOpen,setResumeOpen]=useState(false);
  const[aiOpen,setAiOpen]=useState(false);
  const[aiLoading,setAiLoading]=useState(false);
  const[aiError,setAiError]=useState("");
  const[aiText,setAiText]=useState("");
  const[draft,setDraft]=useState(p.notes||"");
  const[newCat,setNewCat]=useState("");
  const inMyCats=customCats.includes(p.cat);
  const catBg=inMyCats?"#ede9fe":"#f1f5f9";
  const catC=inMyCats?"#6d28d9":"#94a3b8";
  const noteLines=(p.notes||"").split("\n").filter(l=>l.trim());
  const noteHead=noteLines[0]||"";
  function addNewCat(){if(!newCat.trim())return;onAddCat(newCat.trim());onCat(p.id,newCat.trim());setNewCat("");setCatOpen(false);}
  async function handleAI(){
    const cache=getAnalyses();
    if(cache[p.id]){setAiText(cache[p.id]);setAiOpen(v=>!v);return;}
    setAiLoading(true);setAiError("");setAiOpen(true);
    try{
      const claudeKey=localStorage.getItem("sr-v1-claude-key")||"";
      const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:p.title,content:p.summary,apiKey:claudeKey})});
      const d=await r.json();
      if(d.error)throw new Error(d.error);
      setAiText(d.analysis);
      saveAnalysisCache(p.id,d.analysis);
    }catch(e){setAiError(e.message);}
    finally{setAiLoading(false);}
  }
  return(
    <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:14,display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        <select value={p.status} onChange={e=>onSta(p.id,e.target.value)} style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:999,border:"none",background:SC[p.status]?.bg,color:SC[p.status]?.c,cursor:"pointer"}}>
          {STATES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={p.rel} onChange={e=>onRel(p.id,e.target.value)} style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:999,border:"none",background:RC[p.rel]?.bg,color:RC[p.rel]?.c,cursor:"pointer"}}>
          {RELS.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
        <select value={p.area||""} onChange={e=>onArea(p.id,e.target.value)} style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:999,border:"none",background:p.area?"#e0f2fe":"#f1f5f9",color:p.area?"#0369a1":"#94a3b8",cursor:"pointer"}}>
          <option value="">Sin area</option>
          {(areas||[]).map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        <span style={{fontSize:10,color:"#94a3b8",marginLeft:"auto"}}>{p.date}</span>
      </div>
      <a href={p.link} target="_blank" rel="noreferrer" style={{fontSize:13,fontWeight:700,color:"#0f172a",textDecoration:"none",lineHeight:1.35}}>{p.title}</a>
      <div style={{fontSize:10,color:"#94a3b8"}}>{p.newsletter}{p.author?" · "+p.author:""}</div>
      <div style={{position:"relative",display:"inline-block"}}>
        <button onClick={()=>setCatOpen(v=>!v)} style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:999,border:"none",background:catBg,color:catC,cursor:"pointer"}}>{inMyCats?p.cat:"Sin categoria"}</button>
        {catOpen&&(
          <div style={{position:"absolute",top:"110%",left:0,zIndex:10,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:8,minWidth:160,boxShadow:"0 4px 12px rgba(0,0,0,0.1)"}}>
            {customCats.length===0&&<div style={{fontSize:11,color:"#94a3b8",marginBottom:6,padding:"2px 4px"}}>Sin categorias aun</div>}
            {customCats.map(c=>(
              <div key={c} onClick={()=>{onCat(p.id,c);setCatOpen(false);}} style={{fontSize:11,padding:"5px 8px",borderRadius:5,cursor:"pointer",background:p.cat===c?"#ede9fe":"transparent",color:p.cat===c?"#6d28d9":"#334155"}}>{c}</div>
            ))}
            <div style={{borderTop:"1px solid #f1f5f9",marginTop:6,paddingTop:6,display:"flex",gap:4}}>
              <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addNewCat()} placeholder="Nueva..." style={{fontSize:11,border:"1px solid #e2e8f0",borderRadius:5,padding:"3px 6px",flex:1,minWidth:0}}/>
              <button onClick={addNewCat} style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:5,border:"none",background:"#6366f1",color:"#fff"}}>+</button>
            </div>
          </div>
        )}
      </div>
      {p.summary&&<div style={{fontSize:11,color:"#64748b",lineHeight:1.5}}>{p.summary.slice(0,140)}{p.summary.length>140?"...":""}</div>}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <button onClick={()=>setResumeOpen(v=>!v)} style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:6,border:"1px solid #0d9488",background:resumeOpen?"#0d9488":"transparent",color:resumeOpen?"#fff":"#0d9488"}}>Ver resumen</button>
        <button onClick={handleAI} style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:6,border:"1px solid #6366f1",background:aiOpen?"#6366f1":"transparent",color:aiOpen?"#fff":"#6366f1"}}>{aiLoading?"Analizando...":"\u2726 Analizar"}</button>
        <button onClick={()=>setNoteOpen(v=>!v)} style={{fontSize:10,fontWeight:600,padding:"3px 10px",borderRadius:6,border:"1px solid #e2e8f0",background:noteOpen?"#f1f5f9":"transparent",color:"#64748b"}}>{p.notes?"Editar nota":"+ Nota"}</button>
      </div>
      {resumeOpen&&(
        <div style={{background:"#f0fdfa",border:"1px solid #99f6e4",borderRadius:8,padding:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#0f766e",marginBottom:6}}>Resumen</div>
          {p.partial?<div style={{fontSize:11,color:"#64748b"}}>Contenido parcial en el feed. <a href={p.link} target="_blank" rel="noreferrer" style={{color:"#0d9488"}}>Leer articulo completo</a></div>:(
            <>
              <div style={{fontSize:11,color:"#334155",marginBottom:8,lineHeight:1.5}}>{p.summary}</div>
              {p.ideas&&p.ideas.length>0&&(
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:"#0f766e",marginBottom:4}}>Ideas clave</div>
                  {p.ideas.map((idea,i)=><div key={i} style={{fontSize:10,color:"#475569",marginBottom:3,paddingLeft:8,borderLeft:"2px solid #99f6e4"}}>\u00b7 {idea}</div>)}
                </div>
              )}
              <a href={p.link} target="_blank" rel="noreferrer" style={{fontSize:10,color:"#0d9488",display:"block",marginTop:6}}>Leer articulo completo \u2192</a>
            </>
          )}
        </div>
      )}
      {aiOpen&&(
        <div style={{background:"#fafafa",border:"1px solid #e2e8f0",borderRadius:10,padding:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"#6366f1",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span>\u2726 Analisis Estrategico</span>
            <button onClick={()=>setAiOpen(false)} style={{background:"none",border:"none",fontSize:13,color:"#94a3b8",lineHeight:1,padding:0}}>&#10005;</button>
          </div>
          {aiLoading&&<div style={{fontSize:11,color:"#94a3b8",textAlign:"center",padding:"20px 0"}}>Analizando con Claude...</div>}
          {aiError&&<div style={{fontSize:11,color:"#b91c1c",background:"#fee2e2",borderRadius:6,padding:"8px 10px"}}>{aiError}</div>}
          {!aiLoading&&!aiError&&aiText&&(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {parseAnalysis(aiText).map((sec,i)=>{
                const col=secColor(sec.title);
                return(
                  <div key={i} style={{background:col.bg,border:"1px solid "+col.border,borderRadius:8,padding:10}}>
                    <div style={{fontSize:10,fontWeight:700,color:col.title,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{sec.title}</div>
                    <div style={{fontSize:11,color:"#334155",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{sec.content}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
      {noteOpen&&(
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          <textarea value={draft} onChange={e=>setDraft(e.target.value)} rows={3} placeholder="Agregar nota..." style={{fontSize:11,border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 8px",resize:"vertical",color:"#334155"}}/>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{onNote(p.id,draft);setNoteOpen(false);}} style={{fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:6,border:"none",background:"#0f172a",color:"#fff"}}>Guardar</button>
            <button onClick={()=>{setDraft(p.notes||"");setNoteOpen(false);}} style={{fontSize:11,padding:"4px 12px",borderRadius:6,border:"1px solid #e2e8f0",background:"transparent",color:"#64748b"}}>Cancelar</button>
          </div>
        </div>
      )}
      {!noteOpen&&p.notes&&(
        <a href={p.link} target="_blank" rel="noreferrer" style={{textDecoration:"none",display:"block",background:"#fffbeb",border:"1px solid #fde68a",borderRadius:7,padding:"7px 10px"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:2}}>Nota</div>
          <div style={{fontSize:11,color:"#78350f",lineHeight:1.4}}>{noteHead}</div>
        </a>
      )}
    </div>
  );
}
function Brief({posts,customCats}){
  const catGroups=customCats.map(cat=>({cat,items:posts.filter(p=>p.cat===cat)})).filter(g=>g.items.length>0);
  const uncat=posts.filter(p=>!customCats.includes(p.cat));
  const allGroups=[...catGroups,...(uncat.length>0?[{cat:"Sin categoria",items:uncat}]:[])];
  if(posts.length===0)return <div style={{textAlign:"center",padding:40,color:"#94a3b8",fontSize:13}}>Sin articulos. Agrega fuentes y actualiza.</div>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:14}}>
        <div style={{fontSize:11,fontWeight:700,color:"#0f172a",marginBottom:10}}>Resumen del periodo</div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          <div><div style={{fontSize:26,fontWeight:800,color:"#6366f1"}}>{posts.length}</div><div style={{fontSize:10,color:"#94a3b8"}}>articulos</div></div>
          {catGroups.slice(0,4).map(({cat,items})=>(
            <div key={cat}><div style={{fontSize:26,fontWeight:800,color:"#0f172a"}}>{items.length}</div><div style={{fontSize:10,color:"#94a3b8"}}>{cat}</div></div>
          ))}
        </div>
      </div>
      {allGroups.map(({cat,items})=>(
        <div key={cat} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:14}}>
          <div style={{fontSize:11,fontWeight:700,color:cat==="Sin categoria"?"#94a3b8":"#6366f1",marginBottom:8}}>{cat} ({items.length})</div>
          {items.slice(0,6).map(p=>(
            <div key={p.id} style={{marginBottom:7,paddingBottom:7,borderBottom:"1px solid #f8fafc"}}>
              <a href={p.link} target="_blank" rel="noreferrer" style={{fontSize:12,color:"#334155",textDecoration:"none",fontWeight:500,lineHeight:1.35,display:"block"}}>{p.title}</a>
              <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{p.newsletter} \u00b7 {p.date}</div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}
function CatManager({customCats,onAdd,onDelete,onRename,fil,setFil,posts}){
  const[newCat,setNewCat]=useState("");
  const[renaming,setRenaming]=useState(null);
  const[renameDraft,setRenameDraft]=useState("");
  function addCat(){if(!newCat.trim()||customCats.includes(newCat.trim()))return;onAdd(newCat.trim());setNewCat("");}
  function doRename(){if(!renameDraft.trim())return;onRename(renaming,renameDraft.trim());setRenaming(null);}
  return(
    <div>
      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:.5,marginBottom:8}}>MIS CATEGORIAS</div>
      {customCats.length===0&&<div style={{fontSize:11,color:"#cbd5e1",marginBottom:8}}>Sin categorias creadas</div>}
      {customCats.map((c,i)=>{
        const count=(posts||[]).filter(p=>p.cat===c).length;
        return(
          <div key={c} style={{display:"flex",alignItems:"center",gap:4,marginBottom:5}}>
            {renaming===i?(
              <>
                <input value={renameDraft} onChange={e=>setRenameDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doRename()} autoFocus style={{fontSize:11,border:"1px solid #e2e8f0",borderRadius:5,padding:"3px 5px",flex:1}}/>
                <button onClick={doRename} style={{fontSize:10,padding:"3px 6px",borderRadius:4,border:"none",background:"#0f172a",color:"#fff"}}>ok</button>
              </>
            ):(
              <>
                <button onClick={()=>setFil(f=>({...f,cat:f.cat===c?"all":c}))} style={{fontSize:11,flex:1,textAlign:"left",padding:"4px 8px",borderRadius:6,border:"1px solid "+(fil.cat===c?"#6366f1":"#e2e8f0"),background:fil.cat===c?"#ede9fe":"transparent",color:fil.cat===c?"#6d28d9":"#334155",fontWeight:fil.cat===c?700:400}}>{c} <span style={{fontSize:10,opacity:.6}}>({count})</span></button>
                <button onClick={()=>{setRenaming(i);setRenameDraft(c);}} style={{fontSize:11,padding:"2px 4px",background:"none",border:"none",color:"#cbd5e1"}}>{'✎'}</button>
                <button onClick={()=>onDelete(i)} style={{fontSize:11,padding:"2px 4px",background:"none",border:"none",color:"#fca5a5"}}>{'✕'}</button>
              </>
            )}
          </div>
        );
      })}
      {fil.cat!=="all"&&<button onClick={()=>setFil(f=>({...f,cat:"all"}))} style={{fontSize:10,width:"100%",padding:"3px 0",borderRadius:5,border:"1px solid #e2e8f0",background:"transparent",color:"#94a3b8",marginBottom:6}}>Limpiar filtro</button>}
      <div style={{display:"flex",gap:4,marginTop:4}}>
        <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCat()} placeholder="Nueva categoria..." style={{fontSize:11,border:"1px solid #e2e8f0",borderRadius:5,padding:"4px 6px",flex:1}}/>
        <button onClick={addCat} style={{fontSize:11,fontWeight:700,padding:"4px 8px",borderRadius:5,border:"none",background:"#6366f1",color:"#fff"}}>+</button>
      </div>
    </div>
  );
}
function AreaInput({onAdd}){
  const[v,setV]=useState("");
  function add(){if(!v.trim())return;onAdd(v.trim());setV("");}
  return(
    <div style={{display:"flex",gap:4,marginTop:4}}>
      <input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Nueva area..." style={{fontSize:11,border:"1px solid #e2e8f0",borderRadius:5,padding:"4px 6px",flex:1}}/>
      <button onClick={add} style={{fontSize:11,fontWeight:700,padding:"4px 8px",borderRadius:5,border:"none",background:"#0369a1",color:"#fff"}}>+</button>
    </div>
  );
}
function App(){
  const isMobile=useIsMobile();
  const[sources,setSources]=useState(SRCS);
  const[posts,setPosts]=useState([]);
  const[loading,setLoading]=useState(false);
  const[done,setDone]=useState(0);
  const[errs,setErrs]=useState({});
  const[view,setView]=useState("brief");
  const[period,setPeriod]=useState("all");
  const[nurl,setNurl]=useState("");
  const[fil,setFil]=useState({src:"all",rel:"all",sta:"Nuevo",cat:"all",area:"all"});
  const[autoHide,setAutoHide]=useState(false);
  const[showDrawer,setShowDrawer]=useState(false);
  const[customCats,setCustomCats]=useState(()=>getCustomCats());
  const[areas,setAreas]=useState(()=>getAreas());
  const[noteSearch,setNoteSearch]=useState("");
  const[apiOpen,setApiOpen]=useState(false);
  const[srcOpen,setSrcOpen]=useState(false);
  function addCustomCat(name){if(customCats.includes(name))return;const n=[...customCats,name];setCustomCats(n);saveCustomCats(n);}

  async function pushToNotion(post,action){
    const nk=localStorage.getItem(NOTION_KEY)||"";
    if(!nk)return;
    const nid=notionPageIds.current[post.id]||null;
    try{
      if(action==="remove"){
        if(!nid)return;
        await fetch("/api/notion",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({notionKey:nk,action:"remove",notionPageId:nid})});
        delete notionPageIds.current[post.id];
        return;
      }
      const analyses=JSON.parse(localStorage.getItem("sr-v1-analyses")||"{}");
      const rawAn=analyses[post.id]||"";
      const anText=typeof rawAn==="string"?rawAn:"";
      const sumMatch=anText.match(/## Idea Principal\s*([\s\S]*?)(?=##|$)/);
      const summary=sumMatch?sumMatch[1].trim().slice(0,2000):"";
      const insMatch=anText.match(/## Insights Estratégicos\s*([\s\S]*?)(?=##|$)/);
      const insRaw=insMatch?insMatch[1].trim():"";
      const ideas=insRaw.split("\n").map(l=>l.replace(/^[-•*]\s*/,"").trim()).filter(l=>l.length>20).slice(0,5);
      const body={notionKey:nk,action:action,postId:post.id,title:post.title,newsletter:post.newsletter,link:post.link,date:post.date,rel:post.rel,cat:post.cat,area:post.area,notes:post.notes,notionPageId:nid,summary,ideas};
      const r=await fetch("/api/notion",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d=await r.json();
      if(d.ok&&d.notionPageId)notionPageIds.current[post.id]=d.notionPageId;
    }catch(e){}
  }

  async function fetchOne(s){
    try{
      const isSubstack=s.url.includes("substack.com");
      if(isSubstack){
        const host=s.url.match(/https?:\/\/([^\/]+)/)[1];
        const apiUrl="/api/proxy?url="+encodeURIComponent("https://"+host+"/api/v1/posts?limit=25");
        const r=await fetch(apiUrl);
        if(!r.ok)throw new Error("status "+r.status);
        const d=await r.json();
        if(!Array.isArray(d))throw new Error("bad response");
        setSources(p=>p.map(x=>x.id===s.id?{...x,name:s.name}:x));
        return d.map(item=>{
          const body=txt(item.body_html||item.description||"");
          const partial=body.length<120;
          const summary=partial?"Contenido parcial. Clic en el titulo para leer completo.":body.slice(0,280)+(body.length>280?"...":"");
          const ideas=partial?[]:body.split(/[.!?]+/).map(x=>x.trim()).filter(x=>x.length>45).slice(0,3);
          const postId=titleSlug(item.title)||item.canonical_url||String(item.id||Math.random());
          return{id:s.id+"|"+postId,srcId:s.id,newsletter:s.name,title:item.title||"Sin titulo",author:(item.publishedBylines&&item.publishedBylines[0])?item.publishedBylines[0].name:"",date:fd(item.post_date),rawDate:item.post_date||"",link:item.canonical_url||"#",cat:"Sin categoria",rel:"Medio",area:"",summary,ideas,status:"Nuevo",partial,notes:""};
        });
      }else{
        const ak=localStorage.getItem("sr-v1-apikey")||"";
        const reqUrl="https://api.rss2json.com/v1/api.json?"+(ak?"api_key="+ak+"&":"")+"rss_url="+encodeURIComponent(s.url);
        const r=await fetch(reqUrl);
        const d=await r.json();
        if(d.status!=="ok")throw new Error(d.message);
        const name=d.feed?.title||s.name;
        setSources(p=>p.map(x=>x.id===s.id?{...x,name}:x));
        return(d.items||[]).map(item=>{
          const body=txt(item.content||item.description||"");
          const partial=body.length<120;
          const summary=partial?"Contenido parcial. Clic en el titulo para leer completo.":body.slice(0,280)+(body.length>280?"...":"");
          const ideas=partial?[]:body.split(/[.!?]+/).map(x=>x.trim()).filter(x=>x.length>45).slice(0,3);
          return{id:s.id+"|"+(titleSlug(item.title)||item.guid||item.link||Math.random()),srcId:s.id,newsletter:name,title:item.title||"Sin titulo",author:item.author||"",date:fd(item.pubDate),rawDate:item.pubDate||"",link:item.link||"#",cat:"Sin categoria",rel:"Medio",area:"",summary,ideas,status:"Nuevo",partial,notes:""};
        });
      }
    }catch(e){setErrs(p=>({...p,[s.id]:true}));return[];}
  }

      const ann=anns[p.id]||{};

      return{...p,
        status:nan.status||ann.status||p.status,
        notes:nan.notes||ann.notes||p.notes,
        cat:nan.cat||ann.cat||p.cat,

          {view==="table"&&(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,background:"#fff",border:"1px solid #e2e8f0",borderRadius:10}}>
                <thead><tr style={{background:"#f1f5f9"}}>
                  {["Titulo","Fuente","Categoria","Area","Relevancia","Estado","Fecha"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 10px",fontWeight:700,color:"#475569",whiteSpace:"nowrap"}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {visPosts.map((p,i)=>(
                    <tr key={p.id} style={{background:i%2===0?"#fff":"#f8fafc",borderBottom:"1px solid #f1f5f9"}}>
                      <td style={{padding:"7px 10px",maxWidth:260}}><a href={p.link} target="_blank" rel="noreferrer" style={{color:"#334155",textDecoration:"none",fontWeight:600}}>{p.title}</a></td>
                      <td style={{padding:"7px 10px",color:"#64748b",whiteSpace:"nowrap"}}>{p.newsletter}</td>
                      <td style={{padding:"7px 10px",color:"#6366f1",whiteSpace:"nowrap"}}>{p.cat||"Sin categoria"}</td>
                      <td style={{padding:"7px 10px",color:"#0369a1",whiteSpace:"nowrap"}}>{p.area||"—"}</td>
                      <td style={{padding:"7px 10px"}}><span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,background:RC[p.rel]?.bg,color:RC[p.rel]?.c}}>{p.rel}</span></td>
                      <td style={{padding:"7px 10px"}}><span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,background:SC[p.status]?.bg,color:SC[p.status]?.c}}>{p.status}</span></td>
                      <td style={{padding:"7px 10px",color:"#94a3b8",whiteSpace:"nowrap"}}>{p.date}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {visPosts.length===0&&<div style={{textAlign:"center",padding:40,color:"#94a3b8",fontSize:13}}>Sin resultados</div>}
            </div>
          )}
          {view==="cards"&&(
            <div>
              {hasFilter&&<div style={{marginBottom:8}}><button onClick={()=>setFil({src:"all",rel:"all",sta:"Nuevo",cat:"all",area:"all"})} style={{fontSize:11,padding:"3px 10px",borderRadius:5,border:"1px solid #e2e8f0",background:"transparent",color:"#94a3b8"}}>&#10005; Limpiar filtros</button></div>}
              <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
                {visPosts.map(p=>(
                  <PostCard key={p.id} p={p} onSta={onSta} onNote={onNote} onCat={onCat} onRel={onRel} onArea={onArea} customCats={customCats} areas={areas} onAddCat={addCustomCat}/>
                ))}
                {visPosts.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:40,color:"#94a3b8",fontSize:13}}>Sin resultados con los filtros actuales</div>}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
